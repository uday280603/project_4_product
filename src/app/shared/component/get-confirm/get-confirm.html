<div class="card">
  <div class="card-body">
    <div>
      <p>{{ message }}</p>
      <div class="d-flex justify-content-between">
        <button mat-raised-button (click)="onClose(false)">No</button>
        <button mat-raised-button (click)="onClose(true)">Yes</button>
      </div>
    </div>
  </div>
</div>
